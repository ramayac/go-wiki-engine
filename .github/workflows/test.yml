name: test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24"
      - name: unit tests
        run: go test ./...
      - name: vet
        run: go vet ./...
      - name: race tests
        if: matrix.os != 'windows-latest'
        run: go test -race ./...
      - name: audit and parity checks
        run: go test -count=1 ./internal/audit
      - name: release upgrade verification tests
        run: go test -v -count=1 ./internal/upgrade

  quality-and-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.12.2
      - name: govulncheck
        run: |
          out="$(go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./... 2>&1)" || code=$?
          echo "$out"
          if [ "${code:-0}" -ne 0 ]; then
            if grep -qE "gopkg\.in/yaml|github\.com/ramayac/go-wiki-engine" <<<"$out"; then
              exit 1
            fi
          fi
      - name: wiki lint
        run: make wiki-lint
      - name: integration tests
        run: make integration
      - name: scaffold-sync check
        run: |
          make sync-scaffold
          if ! git diff --quiet -- internal/scaffold/files; then
            echo "scaffold/ and internal/scaffold/files are out of sync — run make sync-scaffold"
            git diff -- internal/scaffold/files | head -50
            exit 1
          fi

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        continue-on-error: true
