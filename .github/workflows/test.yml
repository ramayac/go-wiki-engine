name: test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: "1.24"
      - name: unit tests
        run: go test ./...
      - name: vet
        run: go vet ./...
      - name: race tests
        if: matrix.os != 'windows-latest'
        run: go test -race ./...
      - name: audit and parity checks
        run: go test -count=1 ./internal/audit
      - name: release upgrade verification tests
        run: go test -v -count=1 ./internal/upgrade

  quality-and-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: "1.24"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@22266fd7ec9306b9b325299496739920199e57be # v7.2.0
        with:
          version: v2.12.2
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: wiki lint
        run: make wiki-lint
      - name: integration tests
        run: make integration
      - name: scaffold-sync check
        run: |
          make sync-scaffold
          if ! git diff --quiet -- internal/scaffold/files; then
            echo "scaffold/ and internal/scaffold/files are out of sync — run make sync-scaffold"
            git diff -- internal/scaffold/files | head -50
            exit 1
          fi

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/dependency-review-action@3b1392942af1676e897970d4d2919d38f5f6b215 # v4.4.0
