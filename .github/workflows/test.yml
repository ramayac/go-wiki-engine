name: test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: test
        run: go test ./...
      - name: lint
        run: make lint
      - name: integration
        run: make integration
      - name: scaffold-sync check
        run: |
          make sync-scaffold
          if ! git diff --quiet -- internal/scaffold/files; then
            echo "scaffold/ and internal/scaffold/files are out of sync — run make sync-scaffold"
            git diff -- internal/scaffold/files | head -50
            exit 1
          fi
